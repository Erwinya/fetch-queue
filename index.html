<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fetch Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top">
    <p class="kicker">Fetch Queue</p>
    <h1>Concurrent requests with retry + abort</h1>
  </header>
  <main class="wrap">
    <section class="panel controls">
      <label>Concurrency<input id="concurrency" type="number" min="1" max="8" value="2" /></label>
      <label>Retries<input id="retries" type="number" min="0" max="5" value="2" /></label>
      <div class="actions">
        <button id="run" type="button" class="btn">Run queue</button>
        <button id="abort" type="button" class="btn subtle" disabled>Abort all</button>
      </div>
    </section>
    <section class="panel">
      <pre id="log" class="log">Idle.</pre>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
